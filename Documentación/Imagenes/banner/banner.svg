<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="500">
      <stop stop-color="#020617"/>
      <stop offset="0.5" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Glow -->
    <radialGradient id="glow">
      <stop stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Blur -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="90"/>
    </filter>

    <!-- Shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#8B5CF6" flood-opacity="0.45"/>
    </filter>

    <!-- CSS -->
    <style>

      text {
        font-family: Inter, Arial, sans-serif;
      }

      /* Waves */
      .wave1 {
        animation: waveMove1 12s ease-in-out infinite alternate;
      }

      .wave2 {
        animation: waveMove2 18s ease-in-out infinite alternate;
      }

      @keyframes waveMove1 {
        0% {
          transform: translateX(0px);
        }
        100% {
          transform: translateX(-60px);
        }
      }

      @keyframes waveMove2 {
        0% {
          transform: translateX(0px);
        }
        100% {
          transform: translateX(70px);
        }
      }

      /* Floating particles */
      .particles {
        animation: floatParticles 10s ease-in-out infinite alternate;
      }

      @keyframes floatParticles {
        0% {
          transform: translateY(0px);
        }
        100% {
          transform: translateY(-20px);
        }
      }

      /* Title */
      .title {
        animation: titleFloat 6s ease-in-out infinite;
      }

      @keyframes titleFloat {
        0%,100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      /* Messages */
      .m1 { animation: m1 12s infinite; }
      .m2 { animation: m2 12s infinite; }
      .m3 { animation: m3 12s infinite; }
      .m4 { animation: m4 12s infinite; }
      .m5 { animation: m5 12s infinite; }

      @keyframes m1 {
        0%,5% { opacity:0; transform:translateY(20px); }
        10%,100% { opacity:1; transform:translateY(0px); }
      }

      @keyframes m2 {
        0%,20% { opacity:0; transform:translateY(20px); }
        25%,100% { opacity:1; transform:translateY(0px); }
      }

      @keyframes m3 {
        0%,40% { opacity:0; transform:translateY(20px); }
        45%,100% { opacity:1; transform:translateY(0px); }
      }

      @keyframes m4 {
        0%,60% { opacity:0; transform:translateY(20px); }
        65%,100% { opacity:1; transform:translateY(0px); }
      }

      @keyframes m5 {
        0%,80% { opacity:0; transform:translateY(20px); }
        85%,100% { opacity:1; transform:translateY(0px); }
      }

      /* Typing */
      .typing circle {
        animation: blink 1.2s infinite;
      }

      .typing circle:nth-child(2) {
        animation-delay: 0.2s;
      }

      .typing circle:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes blink {
        0%,80%,100% {
          opacity:0.2;
        }
        40% {
          opacity:1;
        }
      }

    </style>

  </defs>

  <!-- Background -->
  <rect width="1600" height="500" fill="url(#bg)"/>

  <!-- Animated Waves -->
  <g class="wave1" opacity="0.2">
    <path d="M0 360C180 300 320 430 520 380C700 330 860 280 1080 360C1280 430 1450 350 1600 320V500H0V360Z"
      fill="#312E81"/>
  </g>

  <g class="wave2" opacity="0.15">
    <path d="M0 390C200 330 420 460 650 390C860 320 1100 450 1600 360V500H0V390Z"
      fill="#7C3AED"/>
  </g>

  <!-- Glow -->
  <ellipse cx="1100" cy="250" rx="380" ry="180"
    fill="url(#glow)"
    filter="url(#blur)"/>

  <!-- Particles -->
  <g class="particles">
    <circle cx="160" cy="100" r="3" fill="#8B5CF6"/>
    <circle cx="310" cy="420" r="2" fill="#38BDF8"/>
    <circle cx="1450" cy="120" r="3" fill="#A855F7"/>
    <circle cx="1300" cy="390" r="2" fill="#60A5FA"/>
  </g>

  <!-- LEFT CONTENT -->
  <g class="title">

    <text x="120" y="180"
      font-size="95"
      font-weight="700"
      fill="white"
      letter-spacing="6">
      NEXORA
    </text>

    <text x="125" y="235"
      font-size="26"
      fill="#C4B5FD"
      letter-spacing="2">
      AI CHATBOT EXPERIENCE
    </text>

    <line x1="120" y1="275" x2="540" y2="275"
      stroke="#8B5CF6"
      stroke-width="3"
      stroke-linecap="round"/>

  </g>

  <text x="120" y="340"
    font-size="24"
    fill="#CBD5E1">
    Conversaciones inteligentes en tiempo real
  </text>

  <text x="120" y="385"
    font-size="24"
    fill="#94A3B8">
    Personalización • IA avanzada • Streamlit
  </text>

  <!-- CHAT -->
  <g transform="translate(930 55)" filter="url(#shadow)">

    <!-- Window -->
    <rect width="500" height="360" rx="30"
      fill="#0F172A"
      stroke="#312E81"
      stroke-width="2"/>

    <!-- Header -->
    <rect width="500" height="60" rx="30"
      fill="#111827"/>

    <circle cx="35" cy="30" r="6" fill="#EF4444"/>
    <circle cx="58" cy="30" r="6" fill="#F59E0B"/>
    <circle cx="81" cy="30" r="6" fill="#10B981"/>

    <text x="120" y="38"
      font-size="18"
      fill="#F8FAFC"
      font-weight="600">
      Nexora Assistant
    </text>

    <!-- USER -->
    <g class="m1">
      <rect x="250" y="90" width="190" height="45" rx="18"
        fill="#4C1D95"/>
      <text x="275" y="118"
        font-size="16"
        fill="white">
        Hola Nexora
      </text>
    </g>

    <!-- AI -->
    <g class="m2">
      <rect x="40" y="150" width="260" height="50" rx="18"
        fill="#1E293B"/>
      <text x="60" y="180"
        font-size="16"
        fill="#E2E8F0">
        Hola, ¿cómo puedo ayudarte?
      </text>
    </g>

    <!-- USER -->
    <g class="m3">
      <rect x="190" y="220" width="250" height="45" rx="18"
        fill="#4C1D95"/>
      <text x="215" y="248"
        font-size="16"
        fill="white">
        Explicame qué es una API
      </text>
    </g>

    <!-- AI -->
    <g class="m4">
      <rect x="40" y="285" width="320" height="50" rx="18"
        fill="#1E293B"/>
      <text x="60" y="315"
        font-size="15"
        fill="#E2E8F0">
        Una API conecta aplicaciones entre sí
      </text>
    </g>

    <!-- TYPING -->
    <g class="m5">
      <rect x="40" y="340" width="90" height="38" rx="18"
        fill="#111827"/>

      <g class="typing" transform="translate(65 359)">
        <circle cx="0" cy="0" r="4" fill="#C4B5FD"/>
        <circle cx="18" cy="0" r="4" fill="#C4B5FD"/>
        <circle cx="36" cy="0" r="4" fill="#C4B5FD"/>
      </g>
    </g>

  </g>

</svg>
